name: Integration tests

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  redis-postgres-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: smart_market_test
          POSTGRES_USER: smart_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smart_test -d smart_market_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_POSTGRES_URL: postgresql+psycopg://smart_test:test-only-password@localhost:5432/smart_market_test
      ENVIRONMENT: test
      SECRET_KEY: integration-test-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify live service connections
        run: |
          python - <<'PY'
          import os
          import redis
          from sqlalchemy import create_engine, text
          r = redis.Redis.from_url(os.environ['TEST_REDIS_URL'])
          assert r.ping() is True
          e = create_engine(os.environ['TEST_POSTGRES_URL'])
          with e.connect() as c:
              assert c.execute(text('select 1')).scalar_one() == 1
          e.dispose()
          print('Redis and PostgreSQL connectivity: OK')
          PY
      - name: Run complete test suite including live integrations
        run: pytest -q
      - name: Verify mobile-first and PWA contract
        run: pytest -q tests/test_mobile_contract.py
      - name: Create isolated migration-check database
        env:
          PGPASSWORD: test-only-password
        run: |
          psql -h localhost -U smart_test -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE smart_market_migration_test"
      - name: Verify PostgreSQL migration chain and Python compilation
        env:
          DATABASE_URL: postgresql+psycopg://smart_test:test-only-password@localhost:5432/smart_market_migration_test
          PGPASSWORD: test-only-password
        run: |
          alembic upgrade head
          alembic current
          alembic heads
          python -m compileall -q app migrations scripts
      - name: Diagnose Alembic database revision state
        # Diagnostic only: preserve revision evidence even if later checks fail.
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+psycopg://smart_test:test-only-password@localhost:5432/smart_market_migration_test
        run: |
          mkdir -p artifacts/schema-drift
          {
            echo "===== Alembic CLI current ====="
            alembic current -v
            echo "===== Alembic CLI heads ====="
            alembic heads -v
            echo "===== Alembic CLI history (top) ====="
            alembic history --verbose | head -80
            echo "===== SQLAlchemy database revision rows ====="
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, inspect, text
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          from alembic.runtime.migration import MigrationContext

          url = os.environ["DATABASE_URL"]
          engine = create_engine(url)
          with engine.connect() as connection:
              tables = set(inspect(connection).get_table_names())
              if "alembic_version" in tables:
                  print("database version rows:", connection.execute(text("SELECT version_num FROM alembic_version ORDER BY version_num")).scalars().all())
              else:
                  print("alembic_version table is missing")
              mc = MigrationContext.configure(connection)
              print("migration context current heads:", mc.get_current_heads())
          engine.dispose()
          script = ScriptDirectory.from_config(Config("alembic.ini"))
          print("repository heads:", script.get_heads())
          print("repository current revisions:", script.get_current_head())
          PY
          } 2>&1 | tee artifacts/schema-drift/revision-state.log
      - name: Generate review-only ORM/schema drift proposal
        # Diagnostic only: its failure must not skip the authoritative blocking audit below.
        continue-on-error: true
        env:
          DATABASE_URL: postgresql+psycopg://smart_test:test-only-password@localhost:5432/smart_market_migration_test
        run: |
          mkdir -p artifacts/schema-drift
          set +e
          output=$(alembic revision --autogenerate -m "diagnostic_schema_drift_review" 2>&1)
          status=$?
          printf '%s\n' "$output" | tee artifacts/schema-drift/autogenerate.log
          if [ "$status" -ne 0 ]; then
            echo "Autogenerate diagnostic failed with exit code $status" | tee -a artifacts/schema-drift/autogenerate.log
            exit "$status"
          fi
          generated=$(find migrations/versions -maxdepth 1 -type f -name '*diagnostic_schema_drift_review.py' -print -quit)
          if [ -z "$generated" ]; then
            echo "Autogenerate completed without a generated migration file." | tee -a artifacts/schema-drift/autogenerate.log
            exit 1
          fi
          cp "$generated" artifacts/schema-drift/proposed_migration_review_only.py
          echo "===== REVIEW-ONLY AUTOGENERATED MIGRATION: $generated ====="
          cat "$generated"
          echo "===== END REVIEW-ONLY AUTOGENERATED MIGRATION ====="
          # Keep the proposal outside Alembic's versions directory so it cannot become a migration head.
          rm -f "$generated"
      - name: Audit ORM-to-migration schema drift (blocking release gate)
        if: always()
        id: orm_schema_drift_audit
        env:
          DATABASE_URL: postgresql+psycopg://smart_test:test-only-password@localhost:5432/smart_market_migration_test
        run: |
          set -o pipefail
          alembic check 2>&1 | tee artifacts/schema-drift/alembic-check.log
      - name: Report schema drift release blocker
        if: ${{ always() && steps.orm_schema_drift_audit.outcome == 'failure' }}
        run: |
          echo "::warning::ORM-to-migration schema drift remains unresolved. Do not release until reviewed and reconciled."
          {
            echo "### Release blocker: ORM/schema drift"
            echo "The Alembic schema audit detected differences between ORM metadata and the migrated PostgreSQL schema."
            echo "The release gate remains blocking; later diagnostics are allowed to run despite this failure so additional issues can be identified."
            echo "**This does not mean the project is production-ready.** Review the generated migration proposal manually; do not apply it blindly because it drops composite indexes and changes unique-constraint/index representations."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload ORM/schema drift evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-evidence
          path: artifacts/schema-drift/
          if-no-files-found: warn
          retention-days: 14
      - name: Security dependency audit
        if: ${{ always() && (success() || steps.orm_schema_drift_audit.outcome == 'failure') }}
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
      - name: Build production container
        if: ${{ always() && (success() || steps.orm_schema_drift_audit.outcome == 'failure') }}
        run: docker build -t smart-market-ci:latest .
      - name: Container smoke test
        if: ${{ always() && (success() || steps.orm_schema_drift_audit.outcome == 'failure') }}
        run: |
          docker run -d --name smart-market-ci -p 18000:8000 \
            -e ENVIRONMENT=test \
            -e SECRET_KEY=ci-container-only-secret \
            smart-market-ci:latest
          trap 'docker logs smart-market-ci || true; docker rm -f smart-market-ci || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/api/live; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:18000/api/live
          curl -fsS http://127.0.0.1:18000/api/readiness
          curl -fsS http://127.0.0.1:18000/api/health
